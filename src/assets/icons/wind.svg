<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Icône « vent » dans le style des icônes des cartes (cloud.png…) :
       tubes clairs avec un contour gris-bleu. Chaque rafale est dessinée
       deux fois : un trait épais gris-bleu (le contour), puis un trait
       plus fin clair par-dessus (l'intérieur). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#a7b9c1" stroke-width="10">
      <path d="M10 38 H52 a12 12 0 1 0 -12 -12" />
      <path d="M10 54 H70 a12 12 0 1 1 -12 12" />
      <path d="M18 70 H38" />
    </g>
    <g stroke="#eef3f6" stroke-width="5">
      <path d="M10 38 H52 a12 12 0 1 0 -12 -12" />
      <path d="M10 54 H70 a12 12 0 1 1 -12 12" />
      <path d="M18 70 H38" />
    </g>
  </g>
</svg>
